<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Roulette Simulation</title>
    <style>
        /* Reset some default styles */
        body,
        p {
            margin: 0;
            padding: 0;
        }

        h1 {
            font-size: 1.5em;
            color: #333;
            margin-top: 24px;
            margin-bottom: 8px;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 18px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        main {
            width: 90%;
            max-width: 400px;
            background: #fff;
            padding: 16px;
        }

        #result {
            white-space: pre-line;
            margin-top: 12px;
            border: 1px solid #ccc;
            padding: 10px;
            background: #f9f9f9;
        }
    </style>
</head>

<body>
    <header>
        <h1>幸運ルーレットシミュレータ</h1>
        <p>v1.0.0 by natama</p>
    </header>
    <main>
        <div id="ayaAmount">所持彩珀: 0 個</div>
        <div>合計課金額: <span id="totalSpent">0</span> 円</div>

        <h2>課金</h2>
        <div class="button-group">
            <button id="buy15000">¥15,000（6480彩珀）</button>
            <button id="buy8000">¥8,000（3280彩珀）</button>
            <button id="buy4900">¥4,900（1980彩珀）</button>
            <button id="buy2500">¥2,500（980彩珀）</button>
            <button id="buy800">¥800（300彩珀）</button>
            <button id="buy160">¥160（60彩珀）</button>
        </div>
        <span>※ボタンをクリックすると彩珀を獲得します。</span>


        <h2>ガチャ(天井カウント: <span id="pityCounterText">0</span> / 160)</h2>
        <div class="button-group">
            <button id="gachaButton">1回</button>
            <button id="gacha10Button">10回</button>
        </div>

        <h2>結果</h2>
        <div>きらめく心の合計: <span id="kiramekuCount">0</span>個</div>
        <div id="result">ここに結果が表示されます。</div>
    </main>
    <script src="gacha.js"></script>
</body>

</html>
